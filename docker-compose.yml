version: '3.8'

services:
  # 1. Redis 7 - Cache & Active Sync Event Bus
  redis:
    image: redis:7-alpine
    container_name: bcafly-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bcafly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Java Spring Boot 3 - Institutional Core Service & Master Data
  core-java:
    build:
      context: ./services/core-java
      dockerfile: Dockerfile
    container_name: bcafly-core-java
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - bcafly-network

  # 3. Python FastAPI - Academic Intelligence & Analytics Microservice
  analytics-python:
    build:
      context: ./services/analytics-python
      dockerfile: Dockerfile
    container_name: bcafly-analytics-python
    restart: always
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - bcafly-network

  # 4. TypeScript Node.js - API Gateway & Real-Time WebSockets
  gateway-ts:
    build:
      context: ./services/gateway-ts
      dockerfile: Dockerfile
    container_name: bcafly-gateway-ts
    restart: always
    depends_on:
      - core-java
      - analytics-python
      - redis
    environment:
      PORT: 5000
      CORE_JAVA_URL: http://core-java:8080
      ANALYTICS_PYTHON_URL: http://analytics-python:8000
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    networks:
      - bcafly-network

  # 5. React 19 Frontend Client
  web-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bcafly-web-client
    restart: always
    depends_on:
      - gateway-ts
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    networks:
      - bcafly-network

networks:
  bcafly-network:
    driver: bridge

volumes:
  redis_data:
