# Server Port
server.port=8080

# Primary PostgreSQL Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bcafly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bcafly_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bcafly_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration (Active Sync & Session Cache)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Logging
logging.level.edu.bcafly.core=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
